<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Experiment 5.2 - User Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Header -->
    <header>
        <h1>Experiment 5.2</h1>
        <p>Global Exception Handling &amp; Structured Logging</p>

        <div class="student-info">
            <p><strong>Name:</strong> Taseen Yasir Pritam</p>
            <p><strong>UID:</strong> 24BAI70036</p>
        </div>
    </header>


    <!-- User Management -->
    <section class="card">

        <h2>User Management</h2>

        <form id="userForm">

            <div class="form-group">
                <label for="uid">UID</label>

                <input
                    type="text"
                    id="uid"
                    placeholder="Enter UID"
                    required
                >
            </div>


            <div class="form-group">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter Name"
                    required
                >
            </div>


            <div class="buttons">

                <button
                    type="submit"
                    id="submitBtn"
                    class="btn-add">
                    Add User
                </button>

                <button
                    type="button"
                    id="updateBtn"
                    class="btn-update">
                    Update User
                </button>

                <button
                    type="button"
                    id="clearBtn"
                    class="btn-clear">
                    Clear
                </button>

            </div>

        </form>

    </section>


    <!-- Search User -->
    <section class="card">

        <h2>Search User</h2>

        <div class="search-box">

            <input
                type="text"
                id="searchUid"
                placeholder="Enter UID to search"
            >

            <button
                type="button"
                id="searchBtn"
                class="btn-search">
                Search
            </button>

        </div>

        <div id="searchResult"></div>

    </section>


    <!-- Users -->
    <section class="card">

        <div class="table-header">

            <h2>Users</h2>

            <button
                type="button"
                id="refreshBtn"
                class="btn-refresh">
                Refresh Users
            </button>

        </div>


        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>UID</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="userTableBody">
                </tbody>

            </table>

        </div>

        <div id="message"></div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
